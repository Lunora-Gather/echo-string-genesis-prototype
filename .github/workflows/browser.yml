name: Browser regression

on: [pull_request, push]

permissions:
  contents: read

jobs:
  game-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test

  safari:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo safaridriver --enable
      - name: Run interaction and visual regressions
        run: |
          (cd prototype && exec node server.mjs 4174) &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:4174/index.html -o /dev/null
          npm run test:browser
